<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Overhead</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/vendor/leaflet.css">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header id="bar">
    <div class="brand">OVERHEAD<span>▲</span></div>
    <div class="stat center"><b id="count">0</b> AIRCRAFT · <b id="overhead-count">0</b> OVERHEAD</div>
    <div class="right">
      <div class="stat" id="clock">--:--:--</div>
      <button id="theme-toggle" type="button" title="Toggle light/dark theme">☾</button>
    </div>
  </header>
  <main id="stage">
    <div id="map"></div>
    <canvas id="scope"></canvas>
    <div id="range-ctl">
      <label for="range">VIEW <b id="range-val">15</b> MI</label>
      <input type="range" id="range" min="4" max="40" step="1" value="15">
    </div>
    <button id="list-toggle" type="button">✈ IN VIEW</button>
    <button id="home-toggle" type="button">⌂ HOME</button>
    <button id="data-toggle" type="button" title="Show data blocks for all aircraft, or only overhead when zoomed out">▤ DATA: OVERHEAD</button>
    <button id="layers-toggle" type="button" title="Show/hide map layers">◧ LAYERS</button>
    <div id="layers-panel">
      <label><input type="checkbox" data-layer="aircraft"> AIRCRAFT</label>
      <label><input type="checkbox" data-layer="trails"> TRAILS</label>
      <label><input type="checkbox" data-layer="blocks"> DATA BLOCKS</label>
      <label><input type="checkbox" data-layer="airports"> AIRPORTS</label>
      <label><input type="checkbox" data-layer="airspace"> AIRSPACE</label>
      <label><input type="checkbox" data-layer="rings"> RANGE RINGS</label>
      <label><input type="checkbox" data-layer="scale"> NM SCALE</label>
    </div>
    <div id="home-panel">
      <label for="home-input">SET HOME — ADDRESS OR LAT,LON</label>
      <input id="home-input" type="text" placeholder="e.g. Seattle, WA" autocomplete="off">
      <div class="row">
        <button id="home-set" type="button">SET</button>
        <span id="home-msg"></span>
      </div>
      <div id="home-recent"></div>
    </div>
    <aside id="list-panel">
      <h3>AIRCRAFT IN VIEW</h3>
      <ul id="ac-list"></ul>
    </aside>
    <div id="wide-banner">VIEW WIDER THAN FEED COVERAGE — SHOWING AIRCRAFT WITHIN 50 MI OF CENTER</div>
    <div id="bw" title="Feed status, data usage, and bandwidth settings"><span id="bw-label">⚙ SETTINGS</span><span id="next-scan"></span></div>
    <div id="bw-chart">
      <div class="hdr"><span>FEED</span><span class="feed"><span class="dot" id="feed-dot"></span> <span id="feed-name">CONNECTING…</span></span></div>
      <div class="hdr"><span>FEED RATE · LAST 60 S</span><span id="bw-cur">—</span></div>
      <canvas id="bw-canvas" width="306" height="84"></canvas>
      <div class="hdr"><span>PER MINUTE · LAST 30 MIN</span><span id="bw-min-peak"></span></div>
      <canvas id="bw-min-canvas" width="306" height="56"></canvas>
      <div id="bw-stats"></div>
      <div id="bwmode-row">
        <span>BANDWIDTH</span>
        <div class="seg">
          <button data-mode="high" type="button">HIGH</button>
          <button data-mode="medium" type="button">MED</button>
          <button data-mode="low" type="button">LOW</button>
        </div>
      </div>
      <div class="note" id="bwmode-note"></div>
    </div>
  </main>
  <script src="/vendor/leaflet.js"></script>
  <script src="/app.js"></script>
</body>
</html>
